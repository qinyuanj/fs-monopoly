# push 前硬地板 slim verify 的 Ubuntu CI(#126 / ADR 0073)。
# 只用 ubuntu-24.04:apt 装 Lua 5.4 与 LuaRocks,再按 ADR 0072 预装五个钉定 rock。
# job 名 `verify` 即 branch protection 的必过检查名,改名需同步仓库设置。
# 退出码 3(平台或工具不可用)同样红灯,但 annotation 与 step summary 标 UNAVAILABLE,先查环境再重跑。
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
# 只在 PR 上自动取消旧运行,main 的每次 push 结果都保留。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.4 + LuaRocks
        run: ./.github/scripts/setup-lua.sh

      - name: lua5.4 tools/cli.lua verify
        run: ./.github/scripts/ci-verify.sh
